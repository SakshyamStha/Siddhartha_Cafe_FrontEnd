<nav class="navbar fixed-top" [class.scrolled]="isScrolled">
  <div class="container navbar__inner">
    <a class="brand-name" routerLink="/home">Siddhartha Cafe</a>

    <ul class="navbar-desktop-nav">
      <li *ngFor="let link of navLinks">
        <a class="nav-link" [routerLink]="link.path" routerLinkActive="active">
          {{ link.label }}
        </a>
      </li>
    </ul>

    <div class="navbar-actions">
      <a class="btn btn-primary" (click)="openReservation()">Reserve a Table</a>
    </div>

    <button
      type="button"
      class="navbar-toggle"
      [class.open]="navOpen"
      (click)="toggleNav()"
      [attr.aria-expanded]="navOpen"
      aria-label="Toggle navigation"
    >
      <span></span><span></span><span></span>
    </button>

    <div class="navbar-mobile-menu" [class.open]="navOpen">
      <a
        class="nav-link"
        *ngFor="let link of navLinks"
        [routerLink]="link.path"
        routerLinkActive="active"
        (click)="closeNav()"
      >
        {{ link.label }}
      </a>
      <div class="navbar-mobile-menu__actions">
        <a class="btn btn-primary" (click)="openReservation(); closeNav()"
          >Reserve a Table</a
        >
      </div>
    </div>
  </div>
</nav>

<app-reservation-modal></app-reservation-modal>
