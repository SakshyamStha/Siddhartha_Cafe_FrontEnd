<section
  class="page-banner"
  [style.background-image]="'url(' + heroImage + ')'"
>
  <div class="page-banner__overlay"></div>
  <div class="page-banner__content">
    <h1 class="page-banner__title">{{ heroTitle }}</h1>
    <p class="page-banner__subtitle">{{ heroSubtitle }}</p>
  </div>
</section>

<section class="section-next-banner" id="menu">
  <div class="container">
    <div class="section-header text-center">
      <p class="section-eyebrow">Taste & Explore</p>
    </div>

    <div class="menu-tabs d-flex justify-content-center gap-2 mb-5 flex-wrap">
      <button
        *ngFor="let cat of menuCategories"
        class="menu-tab"
        [class.active]="activeCategory === cat"
        (click)="setCategory(cat)"
      >
        {{ cat }}
      </button>
    </div>

    <div class="row g-4">
      <div class="col-sm-6 col-lg-4" *ngFor="let item of pagedMenuItems">
        <div class="menu-card h-100">
          <div class="menu-card__img-wrap">
            <img [src]="item.image" [alt]="item.name" class="menu-card__img" />
            <span class="menu-card__badge" *ngIf="item.badge">{{
              item.badge
            }}</span>
          </div>
          <div class="menu-card__body">
            <div class="d-flex justify-content-between align-items-start mb-1">
              <h3 class="menu-card__name">{{ item.name }}</h3>
              <span class="menu-card__price">${{ item.price }}</span>
            </div>
            <p class="menu-card__desc">{{ item.description }}</p>
            <div class="menu-card__tags" *ngIf="item.tags.length">
              <span class="tag" *ngFor="let tag of item.tags">{{ tag }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-5" *ngIf="totalPages > 1">
      <nav class="pagination">
        <button
          class="pagination__btn pagination__btn--nav"
          [disabled]="currentPage === 1"
          (click)="goToPage(currentPage - 1)"
          aria-label="Previous page"
        >
          <i class="bi bi-chevron-left"></i>
        </button>

        <ng-container *ngFor="let page of pageNumbers">
          <span *ngIf="page === -1" class="pagination__ellipsis">…</span>
          <button
            *ngIf="page !== -1"
            class="pagination__btn"
            [class.active]="page === currentPage"
            (click)="goToPage(page)"
            [attr.aria-current]="page === currentPage ? 'page' : null"
          >
            {{ page }}
          </button>
        </ng-container>

        <button
          class="pagination__btn pagination__btn--nav"
          [disabled]="currentPage === totalPages"
          (click)="goToPage(currentPage + 1)"
          aria-label="Next page"
        >
          <i class="bi bi-chevron-right"></i>
        </button>
      </nav>

      <p class="pagination__info">
        Page <span>{{ currentPage }}</span> of
        <span>{{ totalPages }}</span> &nbsp;·&nbsp; Showing
        <span>{{ pagedMenuItems.length }}</span> of
        <span>{{ filteredMenuItems.length }}</span> items
      </p>
    </div>
  </div>
</section>
