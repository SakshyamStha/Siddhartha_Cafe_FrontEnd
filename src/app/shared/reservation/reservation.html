<div
  class="modal fade"
  id="reservationModal"
  tabindex="-1"
  aria-labelledby="reservationModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="reservationModalLabel">Reserve a Table</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>

      <div class="modal-body">
        <div *ngIf="success" class="alert alert-success mb-0">
          Your reservation has been submitted! We'll be in touch shortly.
        </div>

        <div *ngIf="errorMsg" class="alert alert-danger">
          {{ errorMsg }}
        </div>

        <form [formGroup]="form" *ngIf="!success">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label"
                >Full Name <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                formControlName="name"
                [class.is-invalid]="f['name'].invalid && f['name'].touched"
                placeholder="John Doe"
              />
              <div class="invalid-feedback">
                <span *ngIf="f['name'].errors?.['required']"
                  >Name is required.</span
                >
                <span *ngIf="f['name'].errors?.['maxlength']"
                  >Max 100 characters.</span
                >
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label"
                >Email <span class="text-danger">*</span></label
              >
              <input
                type="email"
                class="form-control"
                formControlName="email"
                [class.is-invalid]="f['email'].invalid && f['email'].touched"
                placeholder="john@example.com"
              />
              <div class="invalid-feedback">
                <span *ngIf="f['email'].errors?.['required']"
                  >Email is required.</span
                >
                <span *ngIf="f['email'].errors?.['email']"
                  >Enter a valid email.</span
                >
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label"
                >Phone <span class="text-danger">*</span></label
              >
              <input
                type="tel"
                class="form-control"
                formControlName="phone"
                [class.is-invalid]="f['phone'].invalid && f['phone'].touched"
                placeholder="+977 98XXXXXXXX"
              />
              <div class="invalid-feedback">
                <span *ngIf="f['phone'].errors?.['required']"
                  >Phone is required.</span
                >
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label"
                >Number of Guests <span class="text-danger">*</span></label
              >
              <input
                type="number"
                class="form-control"
                formControlName="number_of_guests"
                [class.is-invalid]="
                  f['number_of_guests'].invalid && f['number_of_guests'].touched
                "
                min="1"
              />
              <div class="invalid-feedback">
                <span *ngIf="f['number_of_guests'].errors?.['required']"
                  >Guests count is required.</span
                >
                <span *ngIf="f['number_of_guests'].errors?.['min']"
                  >At least 1 guest required.</span
                >
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label"
                >Date <span class="text-danger">*</span></label
              >
              <input
                type="date"
                class="form-control"
                formControlName="date"
                [min]="today"
                [class.is-invalid]="f['date'].invalid && f['date'].touched"
              />
              <div class="invalid-feedback">Date is required.</div>
            </div>

            <div class="col-md-6">
              <label class="form-label"
                >Time <span class="text-danger">*</span></label
              >
              <input
                type="time"
                class="form-control"
                formControlName="time"
                [class.is-invalid]="f['time'].invalid && f['time'].touched"
              />
              <div class="invalid-feedback">Time is required.</div>
            </div>

            <div class="col-12">
              <label class="form-label">Special Requests</label>
              <textarea
                class="form-control"
                formControlName="message"
                rows="3"
                placeholder="Dietary requirements, special occasions, seating preferences..."
              ></textarea>
            </div>
          </div>
        </form>
      </div>

      <div class="modal-footer" *ngIf="!success">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button
          type="button"
          class="btn btn-primary"
          (click)="submit()"
          [disabled]="loading"
        >
          <span
            *ngIf="loading"
            class="spinner-border spinner-border-sm me-2"
            role="status"
            aria-hidden="true"
          ></span>
          {{ loading ? "Submitting..." : "Reserve Table" }}
        </button>
      </div>

      <div class="modal-footer" *ngIf="success">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">
          Close
        </button>
      </div>
    </div>
  </div>
</div>
